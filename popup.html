<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jump</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bar">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7l5 5-5 5M12 18h7" /></svg>
    <input id="q" type="text" placeholder="Type part of a tab's title or address" autocomplete="off" spellcheck="false"
           role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list">
    <span id="count" class="count" aria-live="polite"></span>
  </div>
  <ul id="list" role="listbox" aria-label="Tabs"></ul>
  <p id="empty" class="empty" hidden></p>
  <footer>
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>Enter</kbd> switch</span>
    <span><kbd id="closeKey">Ctrl+Del</kbd> close tab</span>
    <span><kbd>Esc</kbd> dismiss</span>
  </footer>
  <script src="fuzzy.js"></script>
  <script src="popup.js"></script>
</body>
</html>
